<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIɢHA · Cámara de entrada</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f5;font-family:Arial,sans-serif;color:#173c2a;min-height:100vh;display:grid;place-items:center}.card{width:min(680px,94vw);background:#fff;border-radius:24px;padding:24px;box-shadow:0 20px 70px #0002;text-align:center}.logo{font-size:34px;font-weight:900;letter-spacing:1px;margin-bottom:6px}.sub{color:#607067;margin:0 0 18px}.video{position:relative;background:#101612;border-radius:18px;overflow:hidden;aspect-ratio:16/10}.video video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.count{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:900;color:#fff;text-shadow:0 4px 20px #000}.status{margin:15px 0;font-weight:800}.ok{color:#08783d}.err{color:#b42318}.btn{border:0;border-radius:12px;padding:13px 18px;background:#08783d;color:#fff;font-weight:800;cursor:pointer}.small{font-size:12px;color:#718078;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">RIɢHA</div>
  <p class="sub">Evidencia fotográfica de entrada</p>
  <div class="video"><video id="video" autoplay muted playsinline></video><div id="count" class="count"></div></div>
  <div id="status" class="status">Preparando cámara...</div>
  <button id="retry" class="btn" style="display:none">Intentar nuevamente</button>
  <div class="small">La fotografía se captura automáticamente y se asocia al documento validado.</div>
</div>
<iframe name="postFrame" id="postFrame" style="display:none"></iframe>
<script>
const qs=new URLSearchParams(location.search);const doc=qs.get('doc')||'';const api=qs.get('api')||'';
const video=document.getElementById('video'),count=document.getElementById('count'),status=document.getElementById('status'),retry=document.getElementById('retry');
let stream=null;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function msg(text,cls=''){status.textContent=text;status.className='status '+cls;}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}video.srcObject=null;}
function errorText(e){const n=e&&e.name||'';const m={NotAllowedError:'Chrome está bloqueando el permiso de cámara para esta página.',NotFoundError:'No se encontró ninguna cámara en este equipo.',NotReadableError:'La cámara está siendo usada por otro programa.',OverconstrainedError:'Esta cámara no admite la configuración solicitada.',SecurityError:'El navegador bloqueó la cámara por seguridad.'};return (m[n]||'No fue posible acceder a la cámara.')+' Código: '+n;}
async function start(){
 retry.style.display='none';
 if(!doc){msg('Falta el documento.','err');return;}
 if(!api){msg('Falta la URL del sistema RIɢHA.','err');return;}
 if(!window.isSecureContext){msg('Esta página debe abrirse con HTTPS.','err');return;}
 try{
  msg('Solicitando acceso a la cámara...');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});}
  video.srcObject=stream;await video.play();msg('Cámara lista · mire al frente','ok');
  for(let n=3;n>=1;n--){count.textContent=n;await sleep(700);}count.textContent='';msg('Capturando fotografía...');
  const c=document.createElement('canvas');c.width=video.videoWidth||1280;c.height=video.videoHeight||720;c.getContext('2d').drawImage(video,0,0,c.width,c.height);
  const foto=c.toDataURL('image/jpeg',.82);stop();
  const form=document.createElement('form');form.method='POST';form.action=api;form.target='postFrame';form.style.display='none';
  const a=document.createElement('input');a.name='action';a.value='registrarEntradaConFoto';
  const d=document.createElement('input');d.name='documento';d.value=doc;
  const f=document.createElement('input');f.name='fotoData';f.value=foto;
  form.append(a,d,f);document.body.appendChild(form);form.submit();form.remove();
  msg('Entrada registrada. Regresando al terminal...','ok');
  setTimeout(()=>{location.href=api;},2200);
 }catch(e){stop();msg(errorText(e),'err');retry.style.display='inline-block';}
}
retry.onclick=start;start();
</script>
</body></html>
