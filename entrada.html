<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIɢHA | Entrada</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#123}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(620px,100%);background:#fff;border-radius:28px;padding:38px;box-shadow:0 18px 55px #0002;text-align:center}
.logo{font-size:48px;font-weight:900;color:#006b35;letter-spacing:-3px}h1{margin:8px 0 4px;font-size:30px}.sub{color:#667;margin-bottom:28px}
input{width:100%;font-size:34px;text-align:center;padding:18px;border:2px solid #d8e1dc;border-radius:16px;outline:0;letter-spacing:3px}input:focus{border-color:#006b35}
button{width:100%;margin-top:16px;padding:18px;border:0;border-radius:16px;background:#006b35;color:#fff;font-size:21px;font-weight:800;cursor:pointer}
.status{margin-top:22px;padding:16px;border-radius:14px;background:#eef5f0;font-weight:700;min-height:54px}
.ok{background:#dff6e7;color:#075c2e}.err{background:#ffe5e5;color:#9b1515}
.small{margin-top:18px;color:#889;font-size:13px}
</style></head>
<body><div class="wrap"><div class="card">
<div class="logo">RIɢHA</div><h1>Registro de entrada</h1><div class="sub">Digite su documento y coloque su huella</div>
<input id="doc" inputmode="numeric" autocomplete="off" maxlength="15" placeholder="Documento">
<button id="go">COLOCAR HUELLA</button>
<div id="status" class="status">ESPERANDO DOCUMENTO</div>
<div class="small">Windows Hello · lector ELAN</div>
</div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwFlanjBT2NHv6ikVUfvk1xz0w-0CjyrWRE207Bmjjvo91MoQhOY6Z7RTkv1qwsxK3l/exec";
const CLAVE="RIGHA-WA-2026";
const RP_ID=location.hostname;
const docEl=document.getElementById('doc'), statusEl=document.getElementById('status'), go=document.getElementById('go');

function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
function bytesToB64u(buf){const bytes=new Uint8Array(buf);let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function rand(n=32){const a=new Uint8Array(n);crypto.getRandomValues(a);return a;}
function setStatus(t,kind=''){statusEl.textContent=t;statusEl.className='status '+kind;}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');params.callback=cb;s.src=API+'?'+new URLSearchParams(params).toString();window[cb]=v=>{delete window[cb];s.remove();resolve(v)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('No se pudo comunicar con RIɢHA'))};document.body.appendChild(s)})}

async function entrada(){
 const doc=docEl.value.replace(/\D/g,''); docEl.value=doc;
 if(!/^\d{5,15}$/.test(doc)){setStatus('Ingrese un documento válido.','err');return}
 if(!window.PublicKeyCredential){setStatus('Este navegador no admite Windows Hello/WebAuthn. Use Edge o Chrome.','err');return}
 go.disabled=true; setStatus('Buscando huella registrada...');
 try{
   const info=await jsonp({api:'credencial',documento:doc,clave:CLAVE});
   if(!info.ok) throw new Error(info.message);
   if(!info.registrado) throw new Error('Este empleado todavía no tiene huella vinculada.');
   setStatus('COLOQUE SU HUELLA EN EL LECTOR...');
   const assertion=await navigator.credentials.get({publicKey:{
      challenge:rand(32),
      rpId:RP_ID,
      allowCredentials:[{type:'public-key',id:b64uToBytes(info.credentialId),transports:['internal']}],
      userVerification:'required',
      timeout:15000
   }});
   if(!assertion) throw new Error('No se recibió la huella.');
   const credentialId=bytesToB64u(assertion.rawId);
   if(credentialId!==info.credentialId) throw new Error('La credencial no coincide.');
   const r=await jsonp({api:'entradaHuella',documento:doc,credentialId,clave:CLAVE});
   if(!r.ok) throw new Error(r.message);
   setStatus((r.nombre||info.nombre)+' · ENTRADA REGISTRADA · '+(r.hora||''),'ok');
   docEl.value=''; setTimeout(()=>{setStatus('ESPERANDO DOCUMENTO');go.disabled=false;docEl.focus()},2500);
 }catch(e){setStatus(e.name==='NotAllowedError'?'Huella no verificada o operación cancelada.':e.message,'err');go.disabled=false;docEl.focus();}
}
go.onclick=entrada;docEl.addEventListener('keydown',e=>{if(e.key==='Enter')entrada();if(e.key==='Escape'){docEl.value='';setStatus('ESPERANDO DOCUMENTO')}});
docEl.focus();
</script></body></html>
